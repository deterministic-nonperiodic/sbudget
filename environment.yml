name: budget
channels:
  - conda-forge
  - nodefaults

dependencies:
  # Core Python environment
  - python>=3.10,<3.13

  # Core scientific stack
  - numpy>=1.26
  - scipy>=1.10
  - pandas>=2.2
  - bottleneck            # speeds up xarray reductions

  # Data handling and parallel computing
  - xarray>=2024.5.0
  - dask[array]>=2024.5.0
  - distributed>=2024.5.0

  # IO and serialization
  - zarr>=2.17
  - netcdf4>=1.6
  - h5netcdf>=1.2
  - h5py>=3.10
  - cftime>=1.6
  - filelock

  # Metadata, units, and projections
  - pint>=0.22
  - pyproj>=3.5
  - pyyaml>=6.0
  - psutil>=5.9            # system memory awareness and worker diagnostics
  - tqdm

  # Build/runtime basics
  - pip
