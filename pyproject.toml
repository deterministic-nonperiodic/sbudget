[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbudget"
version = "0.1.0"
description = "Spectral energy budget of a non-hydrostatic atmosphere"
readme = "README.md"
authors = [
    { name = "Yanmichel A. Morfa", email = "morfa@iap-kborn.de" },
    { name = "Bharath Krishnan", email = "krishnan@iap-kborn.de" }]
requires-python = ">=3.10"
dependencies = [
    # Core scientific stack
    "numpy>=1.26",
    "scipy>=1.10",

    # High-level data structures and parallel computing
    "xarray>=2024.1.0",
    "dask[array]>=2024.1.0",

    # IO and serialization
    "zarr>=2.17",
    "netcdf4>=1.6",
    "h5netcdf>=1.2",

    # Config and metadata utilities
    "pyyaml>=6.0",
    "pyproj>=3.5",
    "pint>=0.22",

    # System and performance utilities
    "psutil>=5.9",
    "filelock",
    "tqdm"
]

[project.scripts]
sbudget = "budget.client:main"