input:
  path: ./model_output.nc
  dims: [ z_mc,  lat, lon ] # [y, x] Names of the horizontal spatial dimensions
  engine: netcdf4           # optional: h5netcdf | netcdf4 | scipy

output:
  path: ./budget_out.zarr   # output file path
  store: zarr               # [netcdf, zarr] format for output files
  overwrite: true           # overwrite existing output files

compute:
  mode: spectral_budget     # Type of computation ["spectral_budget",  "scale_transfer"]
  scales: null              # Used with mode "physical" wavelengths (m), e.g., [1000, 5000, 10000]
  norm: null                # or 'ortho'
  dx: null                  # only for Cartesian grids; lon/lat inferred
  dy: null
  cumulative: true          # default; set false for raw (non-accumulated) spectra
  transfer_form: flux       # invariant, flux. Method for computing nonlinear spectral transfers
  # FFT stability & memory control
  rechunk_spatial: false    # ensure single spatial chunks (y, x) for FFTs, and convolutions
  chunk_size: 512           # constraint on largest chunk size [MB] for a horizontal plane (y, x)
  scheduler: threads        # Dask scheduler [threads, distributed, processes]

variables:
  u: u                      # zonal velocity
  v: v                      # meridional velocity
  w: w                      # vertical velocity
  # The following variables only apply to mode "spectral"
  theta: theta              # preferred; if missing, derive from pressure & temperature
  pressure: p               # optional if theta present
  temperature: temp         # optional if theta present
  density: rho              # optional: derive from pressure & temperature
  divergence: div           # optional: horizontal divergence of wind
  vorticity: vor            # optional;: vertical component of the relative vorticity of wind